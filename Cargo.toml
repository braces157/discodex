[package]
name = "discodex"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Discord Rich Presence for popular AI coding tools and assistants on Windows"
repository = "https://github.com/braces157/discodex"
homepage = "https://github.com/braces157/discodex"
readme = "README.md"
keywords = ["discord", "rich-presence", "ai", "codex", "claude"]
categories = ["development-tools"]

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
discord-rich-presence = "1.1.0"
gpui = { version = "0.2.2", default-features = false }
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
zstd = { version = "0.13", default-features = false }

[build-dependencies]
winresource = "0.1.31"
