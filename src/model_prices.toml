# Standard global API base rates in USD per million tokens.
# OpenAI default cache writes are 30 minutes. GPT-5.5 and earlier use ordinary input pricing.
# Claude default cache writes are 5 minutes. The 1-hour rate applies only to recorded TTL breakdowns.
# Gemini and DeepSeek models have no separate cache-write fee in standard pricing.
# Qwen standard international rates source: https://www.alibabacloud.com/help/en/model-studio/model-pricing
# Qwen default cache writes use the standard 5-minute TTL rate when logs do not record TTL.
# Context, speed/service-tier, time-of-day, region and unrecorded write premiums are excluded.
# Snapshot aliases below were individually verified. Unknown IDs are never matched by prefix.
