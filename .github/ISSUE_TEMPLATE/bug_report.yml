name: Bug report
description: Report a reproducible problem in Discodex
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include prompts, session contents, tokens, or other sensitive data.

  - type: input
    id: version
    attributes:
      label: Discodex version
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: AI provider/app
      placeholder: Codex, Claude Code, Cursor, ChatGPT, etc.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior without pasting private conversation/session content.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Discord Desktop
        2. Start Discodex
        3. Open ...
    validations:
      required: true

